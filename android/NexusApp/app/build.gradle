plugins {
    id 'com.android.application'
}
android {
    namespace 'ai.nexus.app'
    compileSdk 34
    defaultConfig {
        applicationId "ai.nexus.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
